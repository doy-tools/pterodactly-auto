<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: url("https://i.postimg.cc/FRJ9CphB/doyz.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      padding: 20px;
    }

    /* ===== CONTAINER UTAMA ===== */
    .container {
      position: relative;
      width: 750px;
      height: 470px;
      background: #fff;
      border-radius: 30px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .container h1 {
      font-size: 36px;
      margin: -10px 0;
      color: #333;
    }

    /* ===== FORM PUTIH SOLID ===== */
    .form-box {
      position: absolute;
      right: 0;
      width: 50%;
      height: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      color: #333;
      text-align: center;
      padding: 40px;
      z-index: 1;
      transition: .6s ease-in-out 1.2s, visibility 0s 1s;
    }

    .form-box.login { visibility: visible; }
    .form-box.register { visibility: hidden; }

    .container.active .form-box { right: 50%; }
    .container.active .form-box.login { visibility: hidden; }
    .container.active .form-box.register { visibility: visible; }

    form { width: 100%; }

    .input-box {
      position: relative;
      margin: 24px 0;
    }

    .input-box input {
      width: 100%;
      padding: 13px 20px;
      background: #eee;
      border: none;
      outline: none;
      border-radius: 8px;
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .input-box input::placeholder {
      color: #888;
      font-weight: 400;
    }

    .btn {
      width: 100%;
      height: 48px;
      background: #f7b9c4;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #fff;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #f5a3b3;
      transform: translateY(-2px);
    }

    /* ===== PANEL PINK SOLID ===== */
    .toggle-box {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .toggle-box::before {
      content: '';
      position: absolute;
      left: -250%;
      width: 300%;
      height: 100%;
      background: #f7b9c4;
      border-radius: 150px;
      z-index: 2;
      transition: 1.8s ease-in-out;
    }

    .container.active .toggle-box::before {
      left: 50%;
    }

    .toggle-panel {
      position: absolute;
      width: 50%;
      height: 100%;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      transition: .6s ease-in-out;
      padding: 20px;
      text-align: center;
    }

    .toggle-panel h1 {
      color: #fff;
      font-size: 36px;
      margin: 0 0 12px 0;
      line-height: 1.2;
    }

    .toggle-panel p {
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.4;
    }

    .toggle-panel.toggle-left {
      left: 0;
      transition-delay: 1.2s;
    }

    .container.active .toggle-panel.toggle-left {
      left: -50%;
      transition-delay: .6s;
    }

    .toggle-panel.toggle-right {
      right: -50%;
      transition-delay: .6s;
    }

    .container.active .toggle-panel.toggle-right {
      right: 0;
      transition-delay: 1.2s;
    }

    .toggle-panel .btn {
      width: 160px;
      height: 46px;
      background: transparent;
      border: 2px solid #fff;
    }

    .toggle-panel .btn:hover {
      background: #fff;
      color: #f7b9c4;
    }

    /* ===== TOAST NOTIFIKASI ===== */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: #333;
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90%;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.sukses {
      background: linear-gradient(135deg, #3ecf8e, #2fb377);
    }

    .toast.gagal {
      background: linear-gradient(135deg, #ff6b6b, #e63946);
    }

    .toast .ikon {
      font-size: 18px;
    }

    /* ===== RESPONSIVE HP ===== */
    @media screen and (max-width: 650px) {
      .container {
        width: 100%;
        max-width: 420px;
        height: 600px;
        border-radius: 24px;
      }

      .form-box {
        bottom: 0;
        width: 100%;
        height: 70%;
        padding: 28px 24px;
      }

      .container.active .form-box {
        right: 0;
        bottom: 30%;
      }

      .toggle-box::before {
        left: 0;
        top: -270%;
        width: 100%;
        height: 300%;
        border-radius: 25vw;
      }

      .container.active .toggle-box::before {
        left: 0;
        top: 70%;
      }

      .toggle-panel {
        width: 100%;
        height: 30%;
        padding: 16px;
      }

      .toggle-panel.toggle-left {
        top: 0;
      }

      .container.active .toggle-panel.toggle-left {
        left: 0;
        top: -30%;
      }

      .toggle-panel.toggle-right {
        right: 0;
        bottom: -30%;
      }

      .container.active .toggle-panel.toggle-right {
        bottom: 0;
      }

      .toggle-panel h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }

      .toggle-panel p {
        font-size: 12.5px;
        margin-bottom: 10px;
      }

      .toggle-panel .btn {
        width: 120px;
        height: 38px;
        font-size: 13px;
      }

      .container h1 {
        font-size: 28px;
      }

      .input-box {
        margin: 18px 0;
      }

      .input-box input {
        padding: 12px 16px;
        font-size: 15px;
      }

      .btn {
        height: 44px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <span class="ikon" id="toastIkon">✅</span>
    <span id="toastPesan">Pesan</span>
  </div>

  <!-- CONTAINER -->
  <div class="container">

    <!-- LOGIN -->
    <div class="form-box login">
      <form id="formLogin">
        <h1>Login</h1>
        <div class="input-box">
          <input type="text" id="loginUser" placeholder="Username" required>
        </div>
        <div class="input-box">
          <input type="password" id="loginPass" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="form-box register">
      <form id="formRegister">
        <h1>Registration</h1>
        <div class="input-box">
          <input type="text" id="regUser" placeholder="Username" required>
        </div>
        <div class="input-box">
          <input type="password" id="regPass" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
    </div>

    <!-- PANEL GESER -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Hello, Welcome!</h1>
        <p>Don't have an account?</p>
        <button class="btn register-btn">Register</button>
      </div>
      <div class="toggle-panel toggle-right">
        <h1>Hello, Back!</h1>
        <p>Already have an account?</p>
        <button class="btn login-btn">Login</button>
      </div>
    </div>
  </div>

  <script>
    const container = document.querySelector('.container');
    const registerBtn = document.querySelector('.register-btn');
    const loginBtn = document.querySelector('.login-btn');
    const formLogin = document.getElementById('formLogin');
    const formRegister = document.getElementById('formRegister');
    const toast = document.getElementById('toast');
    const toastIkon = document.getElementById('toastIkon');
    const toastPesan = document.getElementById('toastPesan');

    // ===== FUNGSI TOAST =====
    function tampilkanToast(pesan, tipe = 'sukses') {
      toastPesan.textContent = pesan;
      toast.className = 'toast show ' + tipe;
      toastIkon.textContent = tipe === 'sukses' ? '✅' : '❌';

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // ===== TOMBOL GESER PANEL =====
    registerBtn.addEventListener('click', () => {
      container.classList.add('active');
    });

    loginBtn.addEventListener('click', () => {
      container.classList.remove('active');
    });

    // ===== REGISTER =====
    formRegister.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value;

      if (user.length < 3) {
        tampilkanToast('Username minimal 3 karakter!', 'gagal');
        return;
      }

      if (pass.length < 6) {
        tampilkanToast('Password minimal 6 karakter!', 'gagal');
        return;
      }

      localStorage.setItem('user_' + user, pass);

      tampilkanToast('Berhasil daftar! Silakan login.', 'sukses');
      container.classList.remove('active');
      formRegister.reset();
    });

    // ===== LOGIN =====
    formLogin.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;

      const saved = localStorage.getItem('user_' + user);

      if (saved && saved === pass) {
        tampilkanToast('Login berhasil!', 'sukses');
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);
      } else {
        tampilkanToast('Username atau password salah!', 'gagal');
      }
    });
  </script>

</body>
</html>
